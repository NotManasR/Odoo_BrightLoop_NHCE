<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password</title>
<style>
  :root {
    --purple: #714B67;
    --purple-dark: #5a3a52;
    --yellow: #FFC83D;
    --grey: #4a4a4f;
    --grey-light: #e9e9ec;
    --error: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--purple) 0%, var(--purple) 55%, var(--yellow) 55%, var(--yellow) 100%);
    padding: 20px;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 400px;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, .25);
    overflow: hidden;
  }
  .card-header {
    background: var(--grey);
    border-bottom: 5px solid var(--yellow);
    color: #fff;
    text-align: center;
    padding: 28px 20px;
  }
  .card-header h1 { font-size: 1.6rem; letter-spacing: .5px; }
  .card-header p { color: var(--grey-light); font-size: .9rem; margin-top: 6px; }
  form { padding: 28px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: .85rem; font-weight: 600; color: var(--grey); margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #cfcfd4;
    border-radius: 8px;
    font-size: 1rem;
    color: var(--grey);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(113, 75, 103, .2); }
  input.invalid { border-color: var(--error); }
  .error { color: var(--error); font-size: .8rem; margin-top: 5px; min-height: 1em; }
  button.submit {
    width: 100%;
    padding: 13px;
    background: var(--purple);
    color: #fff;
    border: none;
    border-bottom: 4px solid var(--yellow);
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button.submit:hover { background: var(--purple-dark); }
  button.submit:active { transform: translateY(1px); }
  button.submit:disabled { opacity: .7; cursor: not-allowed; }
  .message { text-align: center; margin-top: 16px; font-size: .9rem; min-height: 1.2em; }
  .message.ok { color: #2e7d32; }
  .message.fail { color: var(--error); }
  .switch { text-align: center; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--grey-light); font-size: .9rem; color: var(--grey); }
  .switch a { color: var(--purple); font-weight: 600; text-decoration: none; }
  .switch a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>Forgot Password</h1>
      <p>Enter your email to reset your password</p>
    </div>

    <form id="forgotForm" novalidate>
      <div class="field">
        <label for="email">Email ID</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        <div class="error" id="emailError"></div>
      </div>

      <button type="submit" class="submit" id="submitBtn">Verify Email</button>
      <div class="message" id="message"></div>

      <div class="switch">Remembered it? <a href="signin.html">Back to sign in</a></div>
    </form>
  </div>

<script>
  // Change this to your backend endpoint that checks the email and sends the reset mail
  const API_URL = "http://localhost:5000/api/forgot-password";
  const SIGNIN_PAGE = "signin.html";

  const form = document.getElementById("forgotForm");
  const email = document.getElementById("email");
  const emailError = document.getElementById("emailError");
  const message = document.getElementById("message");
  const submitBtn = document.getElementById("submitBtn");

  function validate() {
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
    emailError.textContent = valid ? "" : "Enter a valid email address.";
    email.classList.toggle("invalid", !valid);
    return valid;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    message.textContent = "";
    message.className = "message";
    if (!validate()) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Verifying...";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email.value.trim() })
      });

      if (!res.ok) {
        let detail = "We could not verify that email. Try again.";
        try { const d = await res.json(); if (d.error) detail = d.error; } catch (_) {}
        throw new Error(detail);
      }

      message.textContent = "Email verified! Redirecting to sign in...";
      message.classList.add("ok");
      setTimeout(() => { window.location.href = SIGNIN_PAGE; }, 1500);
    } catch (err) {
      message.textContent = err.message || "Something went wrong. Try again.";
      message.classList.add("fail");
      submitBtn.disabled = false;
      submitBtn.textContent = "Verify Email";
    }
  });
</script>
</body>
</html>
