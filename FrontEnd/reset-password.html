<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password</title>
<style>
  :root {
    --purple: #714B67;
    --purple-dark: #5a3a52;
    --yellow: #cbcbcb;
    --yellow-dark: #d1d1d1;
    --grey: #4a4a4f;
    --grey-light: #e9e9ec;
    --bg: #f4f2f4;
    --error: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--purple) 0%, var(--purple) 55%, var(--yellow) 55%, var(--yellow) 100%);
    padding: 20px;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 400px;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, .25);
    overflow: hidden;
  }
  .card-header {
    background: var(--grey);
    border-bottom: 5px solid var(--yellow);
    color: #fff;
    text-align: center;
    padding: 28px 20px;
  }
  .card-header h1 { font-size: 1.6rem; letter-spacing: .5px; }
  .card-header p { color: var(--grey-light); font-size: .9rem; margin-top: 6px; }
  form { padding: 28px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: .85rem; font-weight: 600; color: var(--grey); margin-bottom: 6px; }
  .input-wrap { position: relative; }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #cfcfd4;
    border-radius: 8px;
    font-size: 1rem;
    color: var(--grey);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(113, 75, 103, .2); }
  input.invalid { border-color: var(--error); }
  .toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--purple);
    font-size: .8rem; font-weight: 600; cursor: pointer;
  }
  .error { color: var(--error); font-size: .8rem; margin-top: 5px; min-height: 1em; }
  button.submit {
    width: 100%;
    padding: 13px;
    margin-top: 4px;
    background: var(--purple);
    color: #fff;
    border: none;
    border-bottom: 4px solid var(--yellow);
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button.submit:hover { background: var(--purple-dark); }
  button.submit:active { transform: translateY(1px); }
  button.submit:disabled { opacity: .7; cursor: not-allowed; }
  .message { text-align: center; margin-top: 16px; font-size: .9rem; min-height: 1.2em; }
  .message.ok { color: #2e7d32; }
  .message.fail { color: var(--error); }
  .switch { text-align: center; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--grey-light); font-size: .9rem; color: var(--grey); }
  .switch a { color: var(--purple); font-weight: 600; text-decoration: none; }
  .switch a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>Reset Password</h1>
      <p>Choose a new password for your account</p>
    </div>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="password">New Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Enter new password" autocomplete="new-password">
          <button type="button" class="toggle" id="togglePw">Show</button>
        </div>
        <div class="error" id="passwordError"></div>
      </div>

      <div class="field">
        <label for="confirm">Confirm New Password</label>
        <input type="password" id="confirm" placeholder="Re-enter new password" autocomplete="new-password">
        <div class="error" id="confirmError"></div>
      </div>

      <button type="submit" class="submit" id="submitBtn">Reset Password</button>
      <div class="message" id="message"></div>

      <div class="switch">Back to <a href="signin.html">Sign in</a></div>
    </form>
  </div>

<script>
  // Change this to your backend endpoint that saves the new password
  const API_URL = "http://localhost:5000/api/reset-password";
  const SIGNIN_PAGE = "signin.html";

  // The reset link in the email should look like: reset-password.html?token=XXXX
  const token = new URLSearchParams(window.location.search).get("token");

  const form = document.getElementById("resetForm");
  const fields = {
    password: document.getElementById("password"),
    confirm: document.getElementById("confirm")
  };
  const message = document.getElementById("message");
  const submitBtn = document.getElementById("submitBtn");
  const togglePw = document.getElementById("togglePw");

  togglePw.addEventListener("click", () => {
    const show = fields.password.type === "password";
    fields.password.type = show ? "text" : "password";
    fields.confirm.type = show ? "text" : "password";
    togglePw.textContent = show ? "Hide" : "Show";
  });

  function setError(name, text) {
    document.getElementById(name + "Error").textContent = text;
    fields[name].classList.toggle("invalid", !!text);
    return !text;
  }

  function validate() {
    const p = fields.password.value;
    const c = fields.confirm.value;
    const results = [
      setError("password", p.length < 6 ? "Password must be at least 6 characters." : ""),
      setError("confirm", c !== p ? "Passwords do not match." : "")
    ];
    return results.every(Boolean);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    message.textContent = "";
    message.className = "message";
    if (!validate()) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Resetting...";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          token: token,
          password: fields.password.value
        })
      });

      if (!res.ok) {
        let detail = "Could not reset password. The link may have expired.";
        try { const d = await res.json(); if (d.error) detail = d.error; } catch (_) {}
        throw new Error(detail);
      }

      message.textContent = "Password updated! Redirecting to sign in...";
      message.classList.add("ok");
      setTimeout(() => { window.location.href = SIGNIN_PAGE; }, 1500);
    } catch (err) {
      message.textContent = err.message || "Something went wrong. Try again.";
      message.classList.add("fail");
      submitBtn.disabled = false;
      submitBtn.textContent = "Reset Password";
    }
  });
</script>
</body>
</html>
